# LLD-04 §7. Only workspaces affected since the base commit run, so a change
# in targets/ast checks the AST alone and a change in packages/contract
# checks everything that depends on it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint type-check test --filter="...[$BASE]"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="...[$BASE]"
      # Shell first-load JS, reported (the 150 KB budget is not enforced yet).
      - run: test -d apps/shell/.next && pnpm measure:first-load || echo "shell not rebuilt"

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds each affected target, then checks LLD-02 §7 and its budget.
      - run: pnpm turbo run conformance --filter="...[$BASE]"

  e2e:
    # The parity snapshots were recorded on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # Builds the AST target and the shell, serves both, compares snapshots.
      - run: pnpm e2e
